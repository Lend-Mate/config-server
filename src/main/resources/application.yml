server:
  port: 8888

---
spring:
  config:
    activate:
      on-profile: dev
  cloud:
    config:
      server:
        native:
          search-locations: file:///C:/Users/elifcelik/IdeaProjects/lend-mate/lendmate-config-repo/


---
spring:
  config:
    activate:
      on-profile: stage
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI}
          username: ${GITHUB_USERNAME}
          password: ${GITHUB_TOKEN}
          default-label: main
          clone-on-start: true
          force-pull: true
logging:
  level:
    root: info